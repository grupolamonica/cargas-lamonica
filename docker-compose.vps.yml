# docker-compose.vps.yml — VPS overrides for Lamonica Cargas
#
# Usage (IP-only, no domain):
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
#
# Usage (with domain + TLS, after DNS is live):
#   DOMAIN=lamonica.grupolamonica.com.br \
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml -f docker-compose.domain.yml up -d
#
# Requires on VPS:
#   - backend.env in this directory (real credentials)
#   - Platform Traefik running: /opt/platform/traefik/
#   - Docker networks: platform_public, platform_monitoring (created by platform)

services:

  frontend:
    build:
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_API_BASE_URL: ""
    # No ports: Traefik handles edge traffic on port 80/443

  backend:
    env_file:
      - backend.env
    # No ports exposed directly: Traefik routes /api/* here

  # ── Watchtower REMOVIDO ─────────────────────────────────────────────
  # Existiu aqui de 11/05 a 05/08/2026 e NUNCA completou um ciclo: `containrrr/
  # watchtower:latest` resolve para a imagem de 11/11/2023 (última release; projeto
  # arquivado), que fala Docker API 1.25, enquanto o daemon da VPS exige ≥ 1.40
  # ("client version 1.25 is too old"). Ficou em restart-loop — 35.297 restarts.
  #
  # E, mesmo consertando a imagem, seria no-op: ele observa a tag com que o
  # container nasceu, e o deploy fixa `:sha-<commit>` (deploy.yml), tag imutável que
  # nunca recebe update. A premissa do serviço ("polls :latest") não combina com o
  # pinning por SHA que o projeto adotou.
  #
  # Se um dia o objetivo original voltar à mesa (deploy sem depender de SSH), são
  # DUAS mudanças, não uma: usar um fork mantido (ex.: nickfedor/watchtower) E
  # publicar também uma tag móvel além da SHA.
