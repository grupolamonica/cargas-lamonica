# Cabeçalhos de segurança da resposta.
#
# Vive num arquivo à parte por causa da regra de herança do add_header: um bloco
# `location` que declara QUALQUER add_header próprio descarta todos os add_header
# herdados do `server`. Sem este include repetido em cada location, o /index.html
# — justamente o documento que precisa dos cabeçalhos — saía sem nenhum deles.
#
# HSTS: o Traefik termina o TLS e serve tudo por HTTPS (com redirect do :80), então
# o navegador honra o cabeçalho. Sem `preload`: entrar na lista de preload é uma
# porta de mão única (exige o domínio apex e é lenta de desfazer) — decisão de
# infra, não efeito colateral de um fix de cabeçalho.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;
