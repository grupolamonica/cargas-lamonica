# Cabeçalhos de segurança da resposta.
#
# Vive num arquivo à parte por causa da regra de herança do add_header: um bloco
# `location` que declara QUALQUER add_header próprio descarta todos os add_header
# herdados do `server`. Sem este include repetido em cada location, o /index.html
# — justamente o documento que precisa dos cabeçalhos — saía sem nenhum deles.
#
# HSTS: o Traefik termina o TLS e serve tudo por HTTPS (com redirect do :80), então
# o navegador honra o cabeçalho. Sem `preload`: entrar na lista de preload é uma
# porta de mão única (exige o domínio apex e é lenta de desfazer) — decisão de
# infra, não efeito colateral de um fix de cabeçalho.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), microphone=(), camera=()" always;

# ── Content-Security-Policy — EM MODO RELATÓRIO (DC-283 / MED-3) ────────────
#
# Report-Only de propósito: este cabeçalho não bloqueia nada ainda, só reporta a
# violação em POST /api/csp-report. Subir CSP direto em enforce numa SPA com
# muitas telas é como apagar a luz e mandar todo mundo andar — a primeira coisa
# quebrada só aparece quando um operador reclama. Com relatório, a lista de
# ajustes chega antes.
#
# Por que a política é estrita a ponto de valer a pena: o build do Vite não gera
# script inline nenhum (conferido em dist/index.html — só um <script type=module>
# externo), então `script-src 'self'` passa SEM 'unsafe-inline'. É justamente o
# 'unsafe-inline' em script-src que costuma esvaziar uma CSP.
#
# Isto importa porque token de sessão e o rascunho do cadastro (CNH, CPF,
# endereço, dados bancários) vivem em localStorage: qualquer JS que execute na
# página lê tudo. Enquanto essa migração não acontece, a CSP é a principal
# defesa contra exfiltração via XSS ou dependência comprometida.
#
# Escolhas por diretiva:
#   style-src   'unsafe-inline' é inevitável — Radix/shadcn escrevem o atributo
#               style nos componentes. Injeção de estilo é risco muito menor que
#               injeção de script, e isolar em style-src-attr não tem suporte
#               uniforme o bastante.
#   fonts       o index.css faz @import de fonts.googleapis.com, que por sua vez
#               busca os arquivos em fonts.gstatic.com.
#   connect-src Supabase Auth/PostgREST (https) + Realtime (wss).
#   img-src     logo de cliente é PROXIADA por /api/client-logo, então não é
#               preciso liberar host externo; data:/blob: cobrem preview de
#               upload e QR do WhatsApp.
#   frame-ancestors  substitui o X-Frame-Options nos navegadores atuais; os dois
#               ficam porque o antigo ainda vale em cliente velho.
#
# Para virar bloqueante depois de zerar os relatórios: trocar o nome do
# cabeçalho para Content-Security-Policy. Runbook: docs/runbooks/csp-rollout.md
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; report-uri /api/csp-report" always;
