name: Rollback

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Full git SHA of the image to roll back to (e.g. abc1234def5678...)'
        required: true
        type: string
      confirm:
        description: 'Type "rollback" to confirm'
        required: true
        type: string

# Mesmo grupo do job Deploy VPS (deploy.yml): deploy e rollback mutam o mesmo
# estado da VPS e nunca devem rodar em paralelo. Um rollback disparado durante
# um deploy em vôo cancela o deploy — o rollback é ação humana deliberada e ganha.
# O rollback NÃO tem guarda de ordem: regredir para um SHA antigo é exatamente o
# seu propósito.
concurrency:
  group: deploy-prod
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/grupolamonica/lamonica-frontend
  BACKEND_IMAGE: ghcr.io/grupolamonica/lamonica-backend

jobs:
  rollback:
    name: Rollback to SHA
    runs-on: ubuntu-latest
    environment: production
    if: ${{ github.event.inputs.confirm == 'rollback' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate SHA tag exists in GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker manifest inspect ghcr.io/grupolamonica/lamonica-frontend:sha-${{ github.event.inputs.sha }} > /dev/null
          docker manifest inspect ghcr.io/grupolamonica/lamonica-backend:sha-${{ github.event.inputs.sha }} > /dev/null
          echo "SHA tag sha-${{ github.event.inputs.sha }} found in GHCR. Proceeding."

      # Rollback + verificação na MESMA sessão SSH, como o deploy faz: uma segunda
      # conexão sai por outro IP do runner e cai no fail2ban/filtro da porta 22 da
      # VPS (DC-239). timeout/command_timeout também em paridade com o deploy.
      - name: Rollback + Smoke Tests via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          timeout: 60s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/apps/lamonica

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            ROLLBACK_SHA="${{ github.event.inputs.sha }}"
            FRONTEND_TAG="ghcr.io/grupolamonica/lamonica-frontend:sha-${ROLLBACK_SHA}"
            BACKEND_TAG="ghcr.io/grupolamonica/lamonica-backend:sha-${ROLLBACK_SHA}"

            docker pull "${FRONTEND_TAG}"
            docker pull "${BACKEND_TAG}"

            cat > docker-compose.deploy.yml << EOF
            services:
              frontend:
                image: ${FRONTEND_TAG}
              backend:
                image: ${BACKEND_TAG}
            EOF

            # Domínio dos routers HTTPS do Traefik. O deploy exporta isto; sem a
            # variável, docker-compose.domain.yml resolve Host(``) e os routers
            # `websecure` nascem inválidos.
            export DOMAIN="cargas.grupolamonica.com"

            # MESMA invocação do deploy — 4 arquivos, sem --profile.
            #
            # A invocação anterior (`-f docker-compose.yml -f docker-compose.deploy.yml
            # --profile production`) resolvia um conjunto incompleto. Conferido com
            # `docker compose config`:
            #   - sem docker-compose.domain.yml: frontend perde 10 labels, backend 8 e
            #     cadastro-ocr 8 — TODOS os routers `websecure`/letsencrypt e o
            #     redirect HTTP→HTTPS. Sobram só os routers de IP (entrypoint `web`),
            #     ou seja: HTTPS no domínio morre e o site cai para o usuário.
            #   - sem docker-compose.vps.yml: hoje NENHUM serviço vira órfão — o
            #     `watchtower`, que era o único definido só lá, foi removido (crash-loop
            #     desde 11/05/2026 + no-op por construção; ver docker-compose.vps.yml).
            #     Os sidecars (spx-bot, angelira-bot, aspx-renewal, cadastro-ocr,
            #     galileu-bot, gerador-mock-angellira) estão no arquivo base e NÃO
            #     corriam risco. O arquivo segue obrigatório pelos build args e env_file.
            #   - `--profile production` não ativava nada: o único serviço com esse
            #     profile é o reverse-proxy do docker-compose.override.yml, que é de
            #     dev e nem é carregado aqui. Flag morta, removida.
            #
            # Não há `docker compose build` de propósito (o deploy tem): o rollback não
            # faz git reset, então a árvore no disco é a do código NOVO — rebuildar não
            # regrediria sidecar nenhum e um build quebrado travaria o rollback na hora
            # em que ele mais importa. Consequência conhecida: o rollback regride só
            # frontend e backend; sidecars não são versionados por SHA.
            docker compose -f docker-compose.yml -f docker-compose.vps.yml -f docker-compose.domain.yml -f docker-compose.deploy.yml up -d --remove-orphans

            # Confere que os containers subiram na tag pedida (o que um `docker ps` mostraria).
            RUNNING_NOW="$(docker ps --format '{{.Image}}' \
              | grep -oE 'lamonica-(frontend|backend):sha-[0-9a-f]{40}' | sort -u || true)"
            echo "[rollback] imagens no ar após o up -d:"
            echo "${RUNNING_NOW:-<nenhuma>}"
            for svc in frontend backend; do
              echo "$RUNNING_NOW" | grep -q "lamonica-${svc}:sha-${ROLLBACK_SHA}" || {
                echo "::error::${svc} não voltou para a tag sha-${ROLLBACK_SHA}."
                exit 1
              }
            done

            # Smoke tests: o script NÃO aceita alvo — ele resolve o IP do container do
            # backend e bate direto na porta interna, de propósito (bypassa o Traefik).
            # O argumento `http://<host>` que ficava aqui era ignorado em silêncio e dava
            # a falsa impressão de que o edge estava sendo testado.
            bash scripts/smoke-test.sh

            # Como o smoke test bypassa o Traefik, ele não veria os routers HTTPS
            # faltando — exatamente a falha que este workflow causava. Este check cobre
            # o edge. --resolve força o Traefik local (evita depender de hairpin NAT do
            # IP público a partir da própria VPS) mantendo Host/SNI corretos.
            echo "[rollback] verificando o edge HTTPS em https://${DOMAIN}/health"
            EDGE_STATUS="000"
            for attempt in 1 2 3 4 5 6; do
              EDGE_STATUS="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 \
                --resolve "${DOMAIN}:443:127.0.0.1" "https://${DOMAIN}/health" || echo "000")"
              [ "$EDGE_STATUS" = "200" ] && break
              echo "  tentativa ${attempt}: HTTP ${EDGE_STATUS} — aguardando o Traefik reconhecer os containers novos..."
              sleep 5
            done
            if [ "$EDGE_STATUS" != "200" ]; then
              echo "::error::Edge HTTPS respondeu ${EDGE_STATUS} (esperado 200) em https://${DOMAIN}/health. Containers voltaram para sha-${ROLLBACK_SHA}, mas o Traefik não está servindo o domínio — confira os routers websecure e o certificado."
              exit 1
            fi
            echo "  edge HTTPS OK (200)."

            echo "Rollback to sha-${ROLLBACK_SHA} complete."
