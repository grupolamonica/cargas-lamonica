name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      allow_out_of_order:
        description: 'Publicar mesmo que o SHA seja anterior ao HEAD da main (redeploy deliberado de commit antigo)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/grupolamonica/lamonica-frontend
  BACKEND_IMAGE: ghcr.io/grupolamonica/lamonica-backend

jobs:
  # ── Gate: tests must pass before any build ──────────────────────────────────
  test:
    name: Test + Lint
    runs-on: ubuntu-latest
    # Sem isto o job herdava o limite PADRÃO do GitHub Actions (6 HORAS). O gate de
    # teste do frontend já pendurou 20 min no ci.yml em 05/08 (processo do vitest não
    # encerrando, não teste estourando limite) — aqui o mesmo travamento seguraria o
    # DEPLOY, que é o caminho de produção, por até 6h antes de liberar o runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Lint frontend
        run: npm run lint --if-present
        working-directory: frontend

      - name: Lint backend
        run: npm run lint --if-present
        working-directory: backend

      - name: Test frontend
        timeout-minutes: 8
        run: npm run test -- --run
        working-directory: frontend
        env:
          TZ: America/Sao_Paulo
          # Vitest carrega modulos reais via vi.importActual — supabase client exige URL/KEY em module init.
          # Mesmo fix aplicado em ci.yml. Valores reais sao injetados no build step abaixo via secrets.
          VITE_SUPABASE_URL: https://ci.placeholder.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_API_BASE_URL: https://ci.placeholder.invalid

      - name: Test backend
        timeout-minutes: 8
        run: npm run test -- --run
        working-directory: backend
        env:
          TZ: America/Sao_Paulo

  # ── Build frontend image + push to GHCR ─────────────────────────────────────
  build-frontend:
    name: Build Frontend
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      sha_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_PUBLISHABLE_KEY=${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build backend image + push to GHCR ──────────────────────────────────────
  build-backend:
    name: Build Backend
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to VPS via SSH ───────────────────────────────────────────────────
  deploy-vps:
    name: Deploy VPS
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    environment: production
    # Serializa a publicação em produção: um deploy por vez, e o run mais NOVO
    # cancela o mais ANTIGO que ainda estiver publicando. Sem isto, dois merges
    # em sequência corriam soltos e a VPS ficava com a imagem de quem terminasse
    # por último (incidente 03/08/2026: run do 567460e9 terminou 35s depois do
    # run do 47731714 e reescreveu a VPS com a imagem anterior ao HEAD da main).
    #
    # O grupo é compartilhado com rollback.yml — deploy e rollback mexem no mesmo
    # estado da VPS e nunca devem rodar em paralelo.
    #
    # Concurrency só no job de deploy (não no workflow): os builds de todos os
    # SHAs continuam completando e publicando no GHCR, o que preserva os alvos
    # de rollback. Só a publicação é serializada.
    concurrency:
      group: deploy-prod
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Deploy + Smoke Tests via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # timeout = handshake de conexão (default 30s). 60s dá margem quando a
          # VPS demora a aceitar a conexão do runner (DC-239). command_timeout = script.
          timeout: 60s
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd /opt/apps/lamonica

            # Garante que o remote aponta para o novo org com token (repo migrou antoniocesar-dev → grupolamonica)
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/grupolamonica/cargas-lamonica.git"

            # Sync repo config (compose files, scripts, Dockerfiles) to this commit
            git fetch origin main

            # ── Guarda de ordem ────────────────────────────────────────────────
            # Segunda linha de defesa da corrida entre deploys (a primeira é o
            # `concurrency: deploy-prod`, que cancela o run antigo em vôo). Cobre
            # o caso que o cancelamento NÃO cobre: o run antigo chegar ao SSH
            # depois que o run novo já publicou — aí não há nada "em vôo" para
            # cancelar e o antigo sobrescreveria a VPS com código anterior.
            #
            # Regra: abortar quando o SHA deste run é ancestral (estritamente mais
            # antigo) do HEAD da main OU do que já está rodando na VPS. Abortamos
            # ANTES de qualquer mutação (nem `git reset` roda), então a VPS fica
            # exatamente como estava.
            #
            # Rollback deliberado NÃO passa por aqui: rollback.yml tem script
            # próprio, sem guarda. Para redeployar um commit antigo por este
            # workflow, use `workflow_dispatch` com allow_out_of_order=true.
            DEPLOY_SHA="${{ github.sha }}"
            MAIN_SHA="$(git rev-parse origin/main)"
            # Vazio em push; "true"/"false" só em workflow_dispatch.
            ALLOW_OUT_OF_ORDER="${{ github.event.inputs.allow_out_of_order }}"

            # SHA efetivamente rodando na VPS, lido da imagem dos containers
            # (é o que um `docker ps` mostraria). Vazio = primeira subida.
            RUNNING_SHA="$(docker ps --format '{{.Image}}' \
              | grep -oE 'lamonica-backend:sha-[0-9a-f]{40}' \
              | head -n1 | sed 's/.*sha-//' || true)"

            echo "[order-guard] deploy=${DEPLOY_SHA}"
            echo "[order-guard] origin/main=${MAIN_SHA}"
            echo "[order-guard] rodando na VPS=${RUNNING_SHA:-<indeterminado>}"

            if [ "$ALLOW_OUT_OF_ORDER" = "true" ]; then
              echo "[order-guard] override manual (allow_out_of_order=true) — checagem de ordem desligada."
            elif ! git cat-file -e "${DEPLOY_SHA}^{commit}" 2>/dev/null; then
              # Ref fora do histórico local (dispatch de branch não buscada): não
              # há como comparar ordem, segue.
              echo "[order-guard] SHA fora do histórico local — sem comparação de ordem, seguindo."
            else
              if [ "$DEPLOY_SHA" != "$MAIN_SHA" ] \
                && git merge-base --is-ancestor "$DEPLOY_SHA" "$MAIN_SHA"; then
                echo "::error::Deploy fora de ordem abortado: ${DEPLOY_SHA} é ancestral do HEAD da main (${MAIN_SHA}). Um commit mais novo assumiu a main; publicar este run deixaria a VPS atrás do HEAD. Nada foi alterado na VPS."
                exit 1
              fi
              if [ -n "$RUNNING_SHA" ] && [ "$DEPLOY_SHA" != "$RUNNING_SHA" ] \
                && git cat-file -e "${RUNNING_SHA}^{commit}" 2>/dev/null \
                && git merge-base --is-ancestor "$DEPLOY_SHA" "$RUNNING_SHA"; then
                echo "::error::Deploy fora de ordem abortado: ${DEPLOY_SHA} é ancestral do que já roda na VPS (${RUNNING_SHA}). Nada foi alterado na VPS. Para regredir de propósito use o workflow Rollback."
                exit 1
              fi
              echo "[order-guard] ordem OK — seguindo com a publicação."
            fi
            # ───────────────────────────────────────────────────────────────────

            git reset --hard origin/main

            # Authenticate with GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull new images (tagged by SHA)
            docker pull ghcr.io/grupolamonica/lamonica-frontend:sha-${{ github.sha }}
            docker pull ghcr.io/grupolamonica/lamonica-backend:sha-${{ github.sha }}

            # Update docker-compose.yml to pin exact SHA tags
            export FRONTEND_TAG="ghcr.io/grupolamonica/lamonica-frontend:sha-${{ github.sha }}"
            export BACKEND_TAG="ghcr.io/grupolamonica/lamonica-backend:sha-${{ github.sha }}"

            # Write a deploy-override that pins the SHA tags
            cat > docker-compose.deploy.yml << EOF
            services:
              frontend:
                image: ${FRONTEND_TAG}
              backend:
                image: ${BACKEND_TAG}
            EOF

            # Inject ASPX GitHub token into backend.env (required for ASPX sync button)
            # Secret: ASPX_GITHUB_TOKEN (PAT with actions:write / workflow scope on lamonica-cargas-platform)
            if [ -n "${{ secrets.ASPX_GITHUB_TOKEN }}" ]; then
              grep -v "^GITHUB_TOKEN=" backend.env > backend.env.tmp 2>/dev/null || true
              echo "GITHUB_TOKEN=${{ secrets.ASPX_GITHUB_TOKEN }}" >> backend.env.tmp
              mv backend.env.tmp backend.env
            fi

            # Inject BRK (Brasil Risk) config into backend.env (badge de aptidão do conjunto).
            # Secrets: BRK_API_KEY  — mesma key configurada no bot :5010 (SERVERBD)
            #          BRK_BASE_URL — endereço do bot ALCANÇÁVEL a partir do VPS (túnel/port-forward)
            # Só injeta quando AMBOS existem; sem eles o backend segue em BRK_NOT_CONFIGURED (no-op seguro).
            if [ -n "${{ secrets.BRK_API_KEY }}" ] && [ -n "${{ secrets.BRK_BASE_URL }}" ]; then
              grep -vE "^(BRK_API_KEY|BRK_BASE_URL|BRK_SYNC_ENABLED)=" backend.env > backend.env.tmp 2>/dev/null || true
              {
                echo "BRK_BASE_URL=${{ secrets.BRK_BASE_URL }}"
                echo "BRK_API_KEY=${{ secrets.BRK_API_KEY }}"
                echo "BRK_SYNC_ENABLED=1"
              } >> backend.env.tmp
              mv backend.env.tmp backend.env
            fi

            # Habilita o sync situacional SPX (badge de vigência SPX) — o sidecar spx-bot roda
            # neste próprio VPS e os cookies vivem no Supabase (aspx_credentials), então não
            # há secret novo: é só a feature-flag. Idempotente.
            if ! grep -q "^SPX_VIGENCY_SYNC_ENABLED=" backend.env 2>/dev/null; then
              echo "SPX_VIGENCY_SYNC_ENABLED=1" >> backend.env
            fi

            # Domain for HTTPS Traefik routers
            export DOMAIN="cargas.grupolamonica.com"

            # Build all local sidecars (frontend/backend come from GHCR above).
            # IMPORTANTE: `up -d` NÃO reconstrói imagens; sem este build explícito
            # os sidecars com build-context (spx-bot, angelira-bot, etc.) ficavam
            # presos numa imagem antiga a cada deploy — ex.: o keep-alive do spx-bot
            # nunca subia. O layer cache mantém os inalterados rápidos.
            docker compose -f docker-compose.yml -f docker-compose.vps.yml -f docker-compose.domain.yml -f docker-compose.deploy.yml build aspx-renewal spx-bot angelira-bot gerador-mock-angellira cadastro-ocr galileu-bot

            # Bring up with pinned images (includes HTTPS Traefik routers via domain.yml)
            docker compose -f docker-compose.yml -f docker-compose.vps.yml -f docker-compose.domain.yml -f docker-compose.deploy.yml up -d --remove-orphans

            # Confere que os containers subiram na tag pretendida. É a conferência
            # manual de `docker ps` que revelou o incidente 03/08/2026, agora
            # automática: o check só fica verde se a VPS estiver neste SHA.
            RUNNING_NOW="$(docker ps --format '{{.Image}}' \
              | grep -oE 'lamonica-(frontend|backend):sha-[0-9a-f]{40}' | sort -u || true)"
            echo "[order-guard] imagens no ar após o up -d:"
            echo "${RUNNING_NOW:-<nenhuma>}"
            for svc in frontend backend; do
              echo "$RUNNING_NOW" | grep -q "lamonica-${svc}:sha-${{ github.sha }}" || {
                echo "::error::${svc} não subiu na tag pretendida (sha-${{ github.sha }}) — provável deploy concorrente sobrescrevendo esta publicação."
                exit 1
              }
            done

            # Clean up old images (keep last 3)
            docker image prune -f --filter "until=72h" || true

            # Run smoke tests in same SSH session (avoids IP rotation / re-auth issues)
            bash scripts/smoke-test.sh
