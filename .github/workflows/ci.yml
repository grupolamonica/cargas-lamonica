name: CI

on:
  pull_request:
    branches:
      - main
  merge_group:
  push:
    branches:
      - main

# Cancela runs antigos em PRs quando há push novo na mesma branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint + Typecheck + Test + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # ── Install ──────────────────────────────────────────────────────────
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      # ── Lint ─────────────────────────────────────────────────────────────
      - name: Lint frontend
        run: npm run lint --if-present
        working-directory: frontend

      - name: Lint backend
        run: npm run lint --if-present
        working-directory: backend

      # ── Typecheck ────────────────────────────────────────────────────────
      - name: Typecheck frontend
        run: npm run typecheck --if-present
        working-directory: frontend

      - name: Typecheck backend
        run: npm run typecheck --if-present
        working-directory: backend

      # ── Test ─────────────────────────────────────────────────────────────
      # timeout-minutes no PASSO, não só no job: em 05/08 este passo PENDUROU e
      # consumiu os 20 min do job inteiro, então "Test backend", "Build frontend" e
      # "Build backend" nem rodaram — o PR ficou vermelho sem informação sobre o
      # resto. Não é teste estourando limite (vitest.config.ts já tem testTimeout de
      # 15s, que falharia o teste individual): é o processo do vitest não encerrando.
      # A mesma suíte passa em ~71s localmente (74 arquivos, 477 testes) e passou em
      # 2m29s na re-execução, então o travamento é intermitente e não foi reproduzido
      # fora do CI. Este limite não corrige a causa — corta o desperdício e deixa a
      # falha atribuível ao passo certo. Se voltar a acontecer, o próximo passo é
      # trocar o pool do vitest para `forks` (worker travado passa a ser matável) ou
      # bissectar com --no-file-parallelism.
      - name: Test frontend
        timeout-minutes: 8
        run: npm test --if-present
        working-directory: frontend
        env:
          TZ: America/Sao_Paulo
          # Vitest carrega modulos reais via vi.importActual — supabase client exige URL/KEY em module init.
          VITE_SUPABASE_URL: https://ci.placeholder.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_API_BASE_URL: https://ci.placeholder.invalid

      - name: Test backend
        timeout-minutes: 8
        run: npm test --if-present
        working-directory: backend
        env:
          TZ: America/Sao_Paulo

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build frontend
        run: npm run build --if-present
        working-directory: frontend
        env:
          # Build de CI usa placeholders — produção injeta valores reais no deploy.yml
          VITE_SUPABASE_URL: https://ci.placeholder.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          VITE_API_BASE_URL: https://ci.placeholder.invalid

      - name: Build backend
        run: npm run build --if-present
        working-directory: backend

  # ─────────────────────────────────────────────────────────────────────────
  # bots/ — sidecars Python (DC-111 / Sprint 1 / DC-119)
  # Lint Python com ruff + smoke import test (pytest aceita exit 0 mesmo sem
  # suite). Sprint 2 substitui pytest opcional por suite real.
  # ─────────────────────────────────────────────────────────────────────────
  bots-check:
    name: Bots — ruff + pytest smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff + pytest
        run: pip install ruff pytest

      - name: Lint bots/ with ruff
        run: ruff check bots/

      - name: Install angelira deps + smoke import
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'backend'); from main import app; print('angelira OK:', app.title)"
          pytest -q || echo "no tests yet — ok"
        working-directory: bots/angelira

      - name: Install unificada system deps (libcairo para svglib/pycairo)
        run: sudo apt-get install -y libcairo2-dev libgirepository1.0-dev pkg-config

      - name: Install unificada deps + smoke import
        run: |
          pip install -r requirements.txt
          python -c "import sys; sys.path.insert(0, 'backend'); from main import app; print('unificada OK:', app.title)"
          pytest -q || echo "no tests yet — ok"
        working-directory: bots/unificada

  # ─────────────────────────────────────────────────────────────────────────
  # Varreduras de segurança (achado ALTO-13 da auditoria LGPD — DC-283).
  # Antes deste job, `grep 'trivy|gitleaks|npm audit|dependabot' .github/` = vazio.
  #
  # Desenho deliberado: BLOQUEIA o que dá para bloquear hoje, REPORTA o que tem
  # backlog. Medido em 2026-08-07: backend 15 vulnerabilidades (1 crítica, 7
  # altas), frontend 11 (1 crítica, 6 altas). Um gate bloqueante de dependência
  # reprovaria todo PR desde o primeiro dia — e varredura que trava tudo é
  # desligada na primeira semana, deixando o repositório pior do que sem ela.
  #
  # - Segredo novo   → BLOQUEIA (hoje não há nenhum; o histórico conhecido está
  #                    allowlistado por caminho em .gitleaks.toml)
  # - Dependência    → REPORTA no resumo do job; quem queima o backlog é o
  #                    Dependabot (.github/dependabot.yml)
  # - Config de infra→ REPORTA (superfície do MED-7: container como root)
  #
  # Para virar bloqueante depois de zerar o backlog: trocar `continue-on-error`
  # por `--audit-level=high` sem `|| true` e marcar como required check.
  # ─────────────────────────────────────────────────────────────────────────
  security:
    name: Segurança — segredos + dependências
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        # fetch-depth: 0 — o gitleaks precisa do histórico completo para varrer
        # commits antigos, não só a árvore atual.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── BLOQUEANTE: nenhum segredo novo entra na main ──────────────────────
      - name: Gitleaks — varredura de segredos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── REPORTE: dependências (backlog real, ver comentário do job) ────────
      - name: Auditoria de dependências — backend
        id: audit_backend
        continue-on-error: true
        working-directory: backend
        run: |
          echo "### Backend — npm audit" >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=high >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --json 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.stringify(JSON.parse(s).metadata.vulnerabilities))}catch{console.log('n/a')}})" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Auditoria de dependências — frontend
        id: audit_frontend
        continue-on-error: true
        working-directory: frontend
        run: |
          echo "### Frontend — npm audit" >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --audit-level=high >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          npm audit --omit=dev --json 2>/dev/null \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(JSON.stringify(JSON.parse(s).metadata.vulnerabilities))}catch{console.log('n/a')}})" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # ── REPORTE: má configuração de container (superfície do MED-7) ────────
      - name: Trivy — má configuração de Dockerfile e compose
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '0'
          format: table
